<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>⭐Anoni Chat⭐</title>
<style>
body{
font-family: Arial;
background:#003556;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

#form{
background:rgb(72, 74, 76);
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

textarea{
width:100%;
height:80px;
}

button{
margin-top:10px;
padding:10px;
cursor:pointer;
}

.mensaje{
background:rgb(255, 255, 255);
padding:10px;
margin-top:10px;
border-radius:8px;
}

.comentarios{
margin-left:15px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>⭐Anoni Chat⭐</h1>

<div id="form">
<textarea id="texto" placeholder="Escribe tu mensaje anónimo..."></textarea>

<label>Elige un color:</label>
<input type="color" id="color">

<button onclick="publicar()">Publicar</button>
</div>

<div id="muro"></div>

<script>
  const DURACION = 24 * 60 * 60 * 1000

function guardarMensaje(texto,color){
let mensajes = JSON.parse(localStorage.getItem("mensajes")) || []

mensajes.push({
texto:texto,
color:color,
fecha:Date.now()
})

localStorage.setItem("mensajes",JSON.stringify(mensajes))
}

function cargarMensajes(){

let mensajes = JSON.parse(localStorage.getItem("mensajes")) || []
let muro = document.getElementById("muro")

mensajes = mensajes.filter(m => Date.now() - m.fecha < DURACION)

localStorage.setItem("mensajes",JSON.stringify(mensajes))

mensajes.reverse().forEach(m => {

let div=document.createElement("div")
div.className="mensaje"

div.innerHTML=
"<p style='color:"+m.color+"'>"+m.texto+"</p>"+
"<input placeholder='comentar...'>"+
"<button onclick='comentar(this)'>Enviar</button>"+
"<div class='comentarios'></div>"

muro.appendChild(div)

})
}
function publicar(){

let texto = document.getElementById("texto").value
let color = document.getElementById("color").value

if(texto === "") return

guardarMensaje(texto,color)

location.reload()
}
  
let muro = document.getElementById("muro")

let div = document.createElement("div")
div.className = "mensaje"

div.innerHTML =
"<p style='color:"+color+"'>"+texto+"</p>"+
"<input placeholder='comentar...'>"+
"<input type='color' class='colorComentario'>"+
"<button onclick='comentar(this)'>Enviar</button>"+
"<div class='comentarios'></div>"

muro.prepend(div)

document.getElementById("texto").value=""
}

function comentar(boton){

let input = boton.previousElementSibling.previousElementSibling
let colorInput = boton.previousElementSibling
let comentarios = boton.nextElementSibling

let texto = input.value
let color = colorInput.value

if(texto === "") return

let p = document.createElement("p")
p.textContent = texto
p.style.color = color

comentarios.appendChild(p)

input.value=""
}

cargarMensajes()
</script>

</body>
</html>
